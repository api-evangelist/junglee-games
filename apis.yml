name: Junglee Games
description: >-
  Junglee Games is a skill-based online gaming company founded in 2012 by Ankush
  Gera, operating as an independent subsidiary of Flutter Entertainment, which
  acquired a majority stake in 2021 in a deal valuing the company at more than
  $440 million. Headquartered in Gurugram with a studio in Bengaluru, the company
  builds and operates consumer real-money and casual gaming apps for a base of
  over 150 million users, with flagship titles including Junglee Rummy, the Howzat
  fantasy cricket and football platform, Carrom Stars, and Junglee Poker. The
  company positions trust, safety, and fairness as engineering priorities. Junglee
  Games is a consumer gaming provider and does not publish a public developer API,
  SDK, or documented API program; this profile captures its identity, web
  properties, and probed security posture for the API Evangelist network. It was
  surfaced as a portfolio company of 500 Global.
